name: Android (Java) build

on:
  push:
    branches: [java-rewrite, main]
    paths:
      - 'android-java/**'
      - '.github/workflows/android-java.yml'
  pull_request:
    paths:
      - 'android-java/**'
      - '.github/workflows/android-java.yml'
  workflow_dispatch:

concurrency:
  group: android-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # No secrets are needed: app/build.gradle falls back to placeholder values when
      # laukpauk.properties is absent, so CI proves the code compiles and lints, not that it talks to production.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Check 16 KB page alignment of native libraries
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -n 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laukpauk-java-debug
          path: |
            android-java/app/build/outputs/apk/debug/*.apk
            android-java/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
