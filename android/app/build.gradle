plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = providers.gradleProperty('LAUKPAUK_API_BASE_URL')
        .orElse(providers.environmentVariable('LAUKPAUK_API_BASE_URL'))
        .getOrElse('')
def configuredMapsApiKey = providers.gradleProperty('MAPS_API_KEY')
        .orElse(providers.environmentVariable('MAPS_API_KEY'))
        .getOrElse('')

android {
    namespace 'id.laukpauk'
    compileSdk 35

    defaultConfig {
        applicationId 'id.laukpauk'
        minSdk 23
        targetSdk 35
        versionCode 50600
        versionName '5.0.6'
        multiDexEnabled true
        buildConfigField 'String', 'API_BASE_URL', '"' + configuredApiBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        manifestPlaceholders = [MAPS_API_KEY: configuredMapsApiKey]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'com.xendit:xendit-android:3.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
