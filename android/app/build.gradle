plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = providers.gradleProperty('LAUKPAUK_API_BASE_URL')
        .orElse(providers.environmentVariable('LAUKPAUK_API_BASE_URL'))
        .getOrElse('')
def configuredMapsApiKey = providers.gradleProperty('MAPS_API_KEY')
        .orElse(providers.environmentVariable('MAPS_API_KEY'))
        .getOrElse('')

android {
    signingConfigs {
        debug {
            storeFile file('/home/roy/laukpauk_mobile/laukpauk.keystore')
            keyAlias 'laukpauk'
            keyPassword 'medan12345'
            storePassword 'medan12345'
        }
    }
    namespace 'id.laukpauk'
    compileSdk 37

    defaultConfig {
        applicationId 'id.laukpauk'
        minSdk 24
        targetSdk 37
        versionCode 50600
        versionName '5.0.6'
        multiDexEnabled true
        buildConfigField 'String', 'API_BASE_URL', '"' + configuredApiBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        manifestPlaceholders = [MAPS_API_KEY: configuredMapsApiKey]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
    // Xendit SDK is deferred until the native payment flow is ported; its 3DS transitive dependency currently requires authenticated JFrog access.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
